[project]
name = "prise-commande"
version = "1.9.0"
description = "Prise de commande à partir du catalogue matériel"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.4",
    "flet-camera==1.0.4",   # appareil photo intégré (photos du matériel à remplacer)
    "openpyxl",
]

[tool.flet]
org = "com.monentreprise"        # à remplacer par votre domaine inversé
product = "Prise de Commande"    # nom affiché sous l'icône sur le téléphone
icon_background = "#1E6FD9"      # fond bleu derrière l'icône (src/assets/icon.png)
permissions = ["camera"]         # Android demande l'accès à l'appareil photo au premier usage
build_number = 13                 # +1 à chaque version : Android refuse un APK au numéro égal ou inférieur

[tool.flet.splash]
color = "#1E6FD9"                # écran de démarrage bleu, assorti à l'icône
dark_color = "#1E6FD9"

[tool.flet.app]
path = "src"

[tool.flet.android]
# L'APK est installé à la main sur le téléphone (pas via le Play Store) :
# la compression "legacy" donne un fichier .apk plus petit à transférer.
legacy_packaging = true
